name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set version
      id: version
      run: echo "VERSION=1.0.0" >> $GITHUB_ENV

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag task-tracker-back-end:${VERSION}

    - name: Push the Docker image
      run: |
        docker tag nikhildhole:${VERSION} ${{ secrets.DOCKERHUB_USERNAME }}/task-tracker-back-end:${VERSION}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/nikhildhole:${VERSION}
